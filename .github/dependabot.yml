version: 2

# Grouped updates keep the noise down: one PR per ecosystem per week for all
# minor/patch bumps (these are eligible for auto-merge once CI is green — see
# .github/workflows/dependabot-auto-merge.yml), and a separate PR for
# major-version bumps, which always require a human review.
updates:
  # ---- Go modules: main module ----
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # The Go vulnerability database entry GO-2026-6443 (CVE-2026-84445)
      # covers every grpc 1.84.x release, so govulncheck fails on 1.84.0 even
      # though that release already carries the fix (GitHub's reviewed advisory
      # GHSA-2v4p-qf9q-27wj lists it as patched). 1.83.2 is patched in both
      # databases. Remove this once the database range is corrected or grpc
      # 1.85.0 is released.
      - dependency-name: "google.golang.org/grpc"
        versions: [">= 1.84.0, < 1.85.0"]
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  # ---- Go modules: examples module ----
  - package-ecosystem: gomod
    directory: /examples
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "go", "examples"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The examples boot the emulator in-process, so they hold grpc at 1.83.2
      # like the main module. google.golang.org/api v0.299.0 and v0.300.0
      # require grpc 1.84.0. Remove both entries with the main module's.
      - dependency-name: "google.golang.org/grpc"
        versions: [">= 1.84.0, < 1.85.0"]
      - dependency-name: "google.golang.org/api"
        versions: [">= 0.299.0"]
    groups:
      examples-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      examples-major:
        patterns: ["*"]
        update-types: ["major"]

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  # ---- Docker base images ----
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]
