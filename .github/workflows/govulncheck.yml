name: govulncheck

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
  # Scan every pull request too, so a dependency bump that introduces a known
  # vulnerability fails before merge instead of on main.
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # scan with the latest patched Go so stdlib CVEs reflect the real (patched) build toolchain
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Run govulncheck on the examples module
        # The examples build the emulator in-process against the real Google
        # Cloud SDKs, so their dependency graph is scanned too.
        working-directory: examples
        run: govulncheck ./...
