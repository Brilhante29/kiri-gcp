name: Scorecard supply-chain security

# OpenSSF Scorecard: scores the repo's security posture (branch protection,
# pinned dependencies, dangerous workflow patterns, token permissions, ...)
# and uploads results to the Security tab.

on:
  branch_protection_rule:
  schedule:
    - cron: '20 6 * * 1' # Mondays 06:20 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
