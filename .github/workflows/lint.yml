name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run golangci-lint from its official image so the linter binary is always
      # built with a Go version >= the module's target, and matches the v2 config.
      - name: golangci-lint
        run: docker run --rm -v "${{ github.workspace }}":/app -w /app golangci/golangci-lint:latest golangci-lint run ./...
